#cloud-config

package_update: true

packages:
  - ca-certificates
  - curl
  - openssl

write_files:
  - path: /opt/app/docker-compose.yml
    permissions: '0644'
    content: |
      services:

        wasteless-api:
          image: jtaiwo1/wasteless-api-cloud:latest
          ports:
            - "80:80"
          restart: always
          depends_on:
            - wasteless-db
            - wasteless-insights
          environment:
            PORT: 80
            DB_HOST: wasteless-db
            DB_USER: postgres
            DB_NAME: wasteless
            DB_PASSWORD: ${DB_PASSWORD}
            DB_PORT: 5432
            INSIGHTS_URL: http://wasteless-insights:8000
            BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS}
            JWT_SECRET: ${JWT_SECRET}
          networks:
            - wasteless-network

        wasteless-insights:
          image: jtaiwo1/wasteless-insights-cloud:latest
          restart: always
          networks:
            - wasteless-network

        wasteless-db:
          image: jtaiwo1/wasteless-db-cloud:latest
          restart: always
          environment:
            POSTGRES_DB: wasteless
            POSTGRES_PASSWORD: ${DB_PASSWORD}
          volumes:
            - wasteless-data:/var/lib/postgresql/data
          networks:
            - wasteless-network

      networks:
        wasteless-network:

      volumes:
        wasteless-data:

runcmd:
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update -y
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker
  - usermod -aG docker azureuser
  - bash -c 'DB_PASSWORD=$(openssl rand -hex 24); JWT_SECRET=$(openssl rand -hex 32); printf "DB_PASSWORD=%s\nBCRYPT_SALT_ROUNDS=10\nJWT_SECRET=%s\n" "$DB_PASSWORD" "$JWT_SECRET" > /opt/app/.env; chmod 600 /opt/app/.env'
  - cd /opt/app && docker compose up -d